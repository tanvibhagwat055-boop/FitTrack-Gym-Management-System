<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}FitTrack{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
<a class="logo" href="{{ url_for('dashboard') }}">FIT<span>TRACK</span></a>
<nav>
<a href="{{ url_for('dashboard') }}">Dashboard</a>
<a href="{{ url_for('plans') }}">Plans</a>
<a href="{{ url_for('trainers') }}">Trainers</a>
<a href="{{ url_for('classes') }}">Classes</a>
<a href="{{ url_for('equipment') }}">Equipment</a>
<a href="{{ url_for('payments') }}">Payments</a>
</nav>
</header>
<main class="wrap">
{% with messages=get_flashed_messages(with_categories=true) %}
{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<footer>FitTrack • BCA Mini Project • Python + DBMS</footer>
</body>
</html>
